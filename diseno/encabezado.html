<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Encabezado del perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Open+Sans:ital,wght@0,400;0,700;1,400;1,800&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
.lienzo { position: relative; width: 1600px; height: 400px; overflow: hidden; font-family: 'Open Sans', sans-serif;
          background: url(marco_perfil.png) 0 0 / 1600px 400px no-repeat; color: #fff; }
.mono { font-family: 'IBM Plex Mono', Consolas, monospace; letter-spacing: 0.14em; }
.lavanda { color: #d9c4ff; text-shadow: 0 0 22px rgba(143, 58, 255, 0.55), 0 2px 10px rgba(10, 6, 24, 0.6); }
h1 { margin: 0; font-weight: 800; font-style: italic; font-size: 50px; line-height: 1.05; letter-spacing: -0.01em;
     text-shadow: 0 2px 18px rgba(10, 6, 24, 0.6); }
.mapa { position: absolute; top: 40px; display: flex; flex-direction: column; gap: 8px; }
.mapa img { width: 150px; height: 191px; display: block; border: 1px solid #3a3150;
            box-shadow: 0 6px 16px rgba(40, 20, 80, 0.18); }
.mapa span { font-weight: 800; font-style: italic; font-size: 13px; color: #2b2340; }
.num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%;
       background: linear-gradient(135deg, #2a56c6, #8f3aff); color: #fff; font-size: 11px; margin-right: 6px; }
</style>
</head>
<body>
<div class="lienzo">
  <div style="position: absolute; left: 60px; top: 54px; width: 660px;">
    <div style="font-style: italic; font-size: 15px; color: #cdb6ff; text-shadow: 0 1px 8px rgba(10, 6, 24, 0.85);">Geología, geoquímica y geocomputación</div>
    <h1 style="margin-top: 18px;">Carlos Manuel<br><span class="lavanda">Gutiérrez Cruzado</span></h1>
    <p style="margin: 18px 0 0; width: 600px; font-style: italic; font-size: 17px; line-height: 1.5; color: #ddd7ee;
              text-shadow: 0 1px 8px rgba(10, 6, 24, 0.8);">
      Ingeniería Geológica, PUCP. Prospectividad mineral de uranio y tierras raras con datos públicos, Python y
      aprendizaje automático.</p>
  </div>
  <div class="mapa" style="left: 860px;"><img src="relieve_violeta.png" alt=""><span>Relieve</span></div>
  <div class="mapa" style="left: 1036px;"><img src="favorabilidad_U.png" alt=""><span>Favorabilidad del U</span></div>
  <div class="mapa" style="left: 1212px;"><img src="zonas_violeta.png" alt=""><span>Zonas U y tierras raras</span></div>
  <div style="position: absolute; left: 1410px; top: 58px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px;">
    <img src="logo_andeanx.png" alt="AndeanX" style="height: 26px;">
    <img src="logo_pucp.png" alt="PUCP" style="height: 36px;">
  </div>
  <div style="position: absolute; left: 860px; top: 292px; font-style: italic; font-size: 13px; color: #5a5270;">Cordillera Oriental del Perú central</div>
</div>
</body>
</html>
